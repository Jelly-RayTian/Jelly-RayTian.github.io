name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly: refresh pull-request data from GitHub
  workflow_dispatch:

permissions:
  contents: write   # only to commit the refreshed src/content/data/prs.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh pull-request data
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-prs.mjs
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npm run verify
      - name: Commit refreshed data
        if: steps.refresh.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/data/prs.json
          git commit -m "chore: refresh pull-request data"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # A scheduled run only deploys when the data actually changed.
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
